[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biliflow"
version = "0.7.19"
description = "Local-first video review and automation pipeline"
requires-python = ">=3.11,<3.12"
dependencies = [
  "easyocr>=1.7.2,<2",
  "huggingface-hub>=0.34,<2",
  "nvidia-ml-py>=13,<14",
  "pillow>=11,<13",
  "psutil>=7,<8",
  "protobuf>=5,<7",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "sentencepiece>=0.2,<1",
  "timm>=1.0,<2",
  "transformers>=4.55,<6",
]

[project.scripts]
biliflow = "biliflow.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
